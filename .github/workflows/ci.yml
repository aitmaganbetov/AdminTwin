name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: admintwin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: lint
        run: make lint
      - name: OpenAPI document is valid
        run: pipx run openapi-spec-validator==0.7.1 docs/api/openapi.yaml
      - name: unit + e2e (race)
        run: make test-race
      - name: PostgreSQL — RLS isolation (T-TENANT-001) and core store across restarts
        env:
          PGPASSWORD: ci-only
          ADMINTWIN_TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/admintwin_test?sslmode=disable
          ADMINTWIN_TEST_STORE_URL: postgres://postgres:ci-only@localhost:5432/admintwin_store?sslmode=disable
          ADMINTWIN_TEST_PG_CONNECTOR_URL: postgres://admintwin_ro:ro-ci-only@localhost:5432/appdb?sslmode=disable
          ADMINTWIN_TEST_INCIDENTS_DB_URL: postgres://postgres:ci-only@localhost:5432/admintwin_incidents?sslmode=disable
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE admintwin_store"
          psql -h localhost -U postgres -c "CREATE DATABASE appdb"
          psql -h localhost -U postgres -c "CREATE DATABASE admintwin_incidents"
          psql -h localhost -U postgres -c "CREATE ROLE admintwin_ro LOGIN PASSWORD 'ro-ci-only' IN ROLE pg_monitor"
          make test-db
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.3 ./...
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ruff + pytest (offline; no real LLM calls)
        run: make ai-test
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e-mvp:
    runs-on: ubuntu-latest
    needs: [go, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install orchestrator
        run: cd ai && python -m venv .venv && .venv/bin/pip install -q -e '.[dev]'
      - name: MVP scenario on live processes (core + orchestrator, offline model)
        run: bash scripts/e2e-mvp.sh
