apiVersion: v1
kind: ConfigMap
metadata:
  name: admintwin-core
data:
  ADMINTWIN_ADDR: ":8080"
  ADMINTWIN_METRICS_ADDR: ":9464"
  ADMINTWIN_ROOT: /opt/admintwin
  ADMINTWIN_DB_MIGRATE: "true"
  ADMINTWIN_ORCHESTRATOR_URL: http://admintwin-orchestrator:8090
  # ADMINTWIN_OIDC_ISSUER / ADMINTWIN_OIDC_AUDIENCE задаются в overlay площадки.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admintwin-core
  labels: { app.kubernetes.io/name: admintwin-core, app.kubernetes.io/part-of: admintwin }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: admintwin-core }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: admintwin-core, app.kubernetes.io/part-of: admintwin }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      serviceAccountName: admintwin-core
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: admintwin-core }
      containers:
        - name: core
          image: admintwin-core:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9464 }
          envFrom:
            - configMapRef: { name: admintwin-core }
          env:
            # Секреты — из Kubernetes Secret, наполняемого Vault (External Secrets / Vault Agent). В репозитории их нет.
            - name: ADMINTWIN_DATABASE_URL
              valueFrom: { secretKeyRef: { name: admintwin-secrets, key: database-url } }
            - name: ADMINTWIN_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: admintwin-secrets, key: service-token } }
            - name: ADMINTWIN_AUDIT_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: admintwin-secrets, key: audit-signing-key } }
            - name: ADMINTWIN_PII_MASTER_KEY
              valueFrom: { secretKeyRef: { name: admintwin-secrets, key: pii-master-key } }
          readinessProbe:
            httpGet: { path: /api/v1/health/platform, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/v1/health/platform, port: http }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: admintwin-core
spec:
  selector: { app.kubernetes.io/name: admintwin-core }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: metrics, port: 9464, targetPort: metrics }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: admintwin-core
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: admintwin-core }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admintwin-core
automountServiceAccountToken: false
