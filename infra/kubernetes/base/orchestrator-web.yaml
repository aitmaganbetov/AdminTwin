apiVersion: apps/v1
kind: Deployment
metadata:
  name: admintwin-orchestrator
  labels: { app.kubernetes.io/name: admintwin-orchestrator, app.kubernetes.io/part-of: admintwin }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: admintwin-orchestrator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: admintwin-orchestrator, app.kubernetes.io/part-of: admintwin }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: orchestrator
          image: admintwin-orchestrator:0.1.0
          ports: [{ name: http, containerPort: 8090 }]
          env:
            - { name: ADMINTWIN_CORE_URL, value: "http://admintwin-core:8080" }
            - { name: ADMINTWIN_NATS_URL, value: "nats://admintwin-nats:4222" }
            - name: ADMINTWIN_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: admintwin-secrets, key: service-token } }
            # Ключи LLM-провайдеров (BYO, §6.1) — в Vault клиента; сюда попадают только через Secret.
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: admintwin-llm, key: anthropic-api-key, optional: true } }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: admintwin-llm, key: openai-api-key, optional: true } }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: admintwin-orchestrator
spec:
  selector: { app.kubernetes.io/name: admintwin-orchestrator }
  ports: [{ name: http, port: 8090, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admintwin-web
  labels: { app.kubernetes.io/name: admintwin-web, app.kubernetes.io/part-of: admintwin }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: admintwin-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: admintwin-web, app.kubernetes.io/part-of: admintwin }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: admintwin-web:0.1.0
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: ADMINTWIN_CORE_URL, value: "http://admintwin-core:8080" }
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: cache, mountPath: /app/.next/cache }]
      volumes: [{ name: cache, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: admintwin-web
spec:
  selector: { app.kubernetes.io/name: admintwin-web }
  ports: [{ name: http, port: 3000, targetPort: http }]
