openapi: 3.1.0
info:
  title: AdminTwin Core API
  version: 0.1.0
  summary: AI Infrastructure Digital Twin & Autonomous IT Operations Platform — ядро (Stage 0)
  description: |
    Единая точка любой записи в инфраструктуру — `POST /api/v1/changes` (ТЗ §11, §13).
    `POST /api/v1/executions` отсутствует: исполнения создаёт только Change Coordinator.
    Ошибки — RFC 9457 (`application/problem+json`), тип в домене `https://errors.admintwin.io/`.

    **Аутентификация.** Пользователи — OIDC `Authorization: Bearer <JWT>` (RS256/PS256/ES256; tenant, роли и scopes —
    из утверждений `admintwin_tenant`, `admintwin_roles`, `admintwin_scopes`; MFA — по `amr`). Сервисы — заголовок
    `X-AdminTwin-Service-Token` + `X-AdminTwin-Tenant/Actor/Actor-Kind` (только `ai_agent` или `service`).
    Dev-режим `ADMINTWIN_DEV_AUTH=true` — заголовки `X-AdminTwin-*`, только для локальной разработки.
    Согласования, kill switch, break-glass и смена политики требуют MFA (`403 mfa-required`).
servers:
  - url: http://localhost:8080
security:
  - oidc: []
  - serviceToken: []
tags:
  - name: inventory
  - name: changes
  - name: registry
  - name: safety
  - name: audit
  - name: ai
  - name: observability
  - name: incidents
  - name: discovery
paths:
  /api/v1/health/platform:
    get:
      tags: [safety]
      security: []
      summary: Здоровье платформы (M24)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /api/v1/assets:
    get:
      tags: [inventory]
      summary: Активы tenant
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AssetList" } } } }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/assets/{id}:
    get:
      tags: [inventory]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/assets/{id}/blast-radius:
    get:
      tags: [inventory]
      summary: Транзитивно зависимые активы с confidence (глубина ≤ 5)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset_id: { type: string, format: uuid }
                  max_depth: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/Impacted" } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/topology:
    get:
      tags: [inventory]
      responses:
        "200": { description: Узлы и рёбра с источником и confidence, content: { application/json: { schema: { type: object } } } }
  /api/v1/runbooks:
    get:
      tags: [registry]
      summary: Каталог сертифицированных runbook
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /api/v1/capabilities:
    get:
      tags: [registry]
      parameters:
        - { name: tier, in: query, schema: { type: string, enum: [MVP, P1a, P1b, P2] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /api/v1/capabilities/{id}/tests:
    get:
      tags: [registry]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: "^[A-Z]{2,4}-\\d{3}$" } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/capabilities/traceability:
    get:
      tags: [registry]
      summary: Матрица трассируемости стандарт × capability × артефакт (генерируется из реестров)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /api/v1/standards:
    get:
      tags: [registry]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /api/v1/changes:
    post:
      tags: [changes]
      summary: Создать ChangeRequest (человек или propose-tool агента)
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeCreate" }
      responses:
        "201": { description: "Создан: proposed (Observer/Advisor) или уже завершён", content: { application/json: { schema: { $ref: "#/components/schemas/Change" } } } }
        "202": { description: "Принят: waiting_approval или исполняется", content: { application/json: { schema: { $ref: "#/components/schemas/Change" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      tags: [changes]
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Change" } } } } } } }
  /api/v1/changes/{id}:
    get:
      tags: [changes]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Change" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/changes/{id}/decisions:
    post:
      tags: [changes]
      summary: Согласовать / отклонить (только человек; не автор; dual control для critical)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                comment: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Change" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/changes/{id}/cancel:
    post:
      tags: [changes]
      summary: Отмена; для исполняемых — cooperative cancellation (cancellation_pending)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { reason: { type: string } } }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Change" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/changes/{id}/executions:
    get:
      tags: [changes]
      summary: Дочерние ExecutionRequest (read-only)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /api/v1/executions/{id}:
    get:
      tags: [changes]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/kill-switch:
    get:
      tags: [safety]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
    post:
      tags: [safety]
      summary: Аварийная остановка (tenant — TA/ITM/Operator; platform — Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [active, reason]
              properties:
                scope: { type: string, enum: [tenant, platform], default: tenant }
                active: { type: boolean }
                reason: { type: string, minLength: 1 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/audit-logs:
    get:
      tags: [audit]
      parameters:
        - { name: object_id, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/audit-logs/integrity:
    get:
      tags: [audit]
      summary: Верификация hash chain и подписанный checkpoint (Auditor, Compliance Manager, Tenant Admin)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /api/v1/evidence/{id}:
    get:
      tags: [audit]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: purpose, in: query, required: true, schema: { type: string, minLength: 1 }, description: "purpose-of-access; журналируется" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/tools:
    get:
      tags: [registry]
      summary: Read tools, доступные субъекту (для агента — только его tool scope)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /api/v1/tools/{name}:
    post:
      tags: [registry]
      summary: Вызов read tool (Tool Service §3.3). Вход/выход — по ai/tools/read/{name}.json; execute-инструментов не существует
      parameters: [{ name: name, in: path, required: true, schema: { type: string, examples: [metrics.query] } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { input: { type: object } } } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool: { type: string }
                  version: { type: string }
                  data_class: { type: string, enum: [public, internal, confidential, pii, secret, unknown] }
                  data: { type: object }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenant/policy:
    get:
      tags: [safety]
      summary: Режим автономности и политика tenant
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TenantPolicy" } } } }
    put:
      tags: [safety]
      summary: Изменить политику / режим (только Tenant Admin, MFA; аудит)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TenantPolicy" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TenantPolicy" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/changes/{id}/pir:
    post:
      tags: [changes]
      summary: Post-implementation review (IT Manager / Tenant Admin, не автор); закрывает manual_review
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [summary]
              properties:
                summary: { type: string, minLength: 10 }
                findings: { type: string }
                corrective_actions: { type: array, items: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Change" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/agent-tasks:
    get:
      tags: [ai]
      summary: Задачи AI (прокси к оркестратору; tenant — из идентичности)
      responses:
        "200": { description: OK }
    post:
      tags: [ai]
      summary: Создать AI-задачу (TA, ITM, Engineer, Operator)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [rca, chat, diagnose] }
                objective: { type: string }
                incident_id: { type: string, format: uuid }
                scope: { type: object, properties: { asset_ids: { type: array, items: { type: string, format: uuid } } } }
      responses:
        "202": { description: Accepted }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/agent-tasks/{rest}:
    get:
      tags: [ai]
      summary: "{id}, {id}/events (SSE, Last-Event-ID)"
      parameters: [{ name: rest, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "JSON или text/event-stream" }
    post:
      tags: [ai]
      summary: "{id}/cancel, {id}/input"
      parameters: [{ name: rest, in: path, required: true, schema: { type: string } }]
      responses:
        "202": { description: Accepted }
  /api/v1/chat/sessions:
    post:
      tags: [ai]
      summary: Сессия ChatOps
      responses:
        "201": { description: Created }
  /api/v1/chat/sessions/{rest}:
    get:
      tags: [ai]
      summary: "{id}/events (SSE)"
      parameters: [{ name: rest, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: text/event-stream }
    post:
      tags: [ai]
      summary: "{id}/messages"
      parameters: [{ name: rest, in: path, required: true, schema: { type: string } }]
      responses:
        "202": { description: Accepted }
  /api/v1/telemetry/samples:
    post:
      tags: [observability]
      summary: Приём метрик (только service с токеном; tenant/актив — из идентичности и CMDB)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { samples: { type: array, items: { $ref: "#/components/schemas/Sample" } } } } } } }
      responses:
        "202": { description: Accepted }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/telemetry/logs:
    post:
      tags: [observability]
      summary: Приём журналов (service); сообщения — недоверенные данные
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "202": { description: Accepted }
    get:
      tags: [observability]
      parameters:
        - { name: asset_id, in: query, schema: { type: string, format: uuid } }
        - { name: contains, in: query, schema: { type: string } }
        - { name: min_severity, in: query, schema: { type: string, enum: [critical, high, medium, low, info] } }
        - { name: window, in: query, schema: { type: string, default: 15m } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "{entries, truncated}" }
  /api/v1/telemetry/events:
    post:
      tags: [observability]
      summary: Приём событий/алертов (service); severity ≥ high создаёт или дополняет инцидент
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: "#/components/schemas/Event" } } } } } } }
      responses:
        "202": { description: "{accepted, incidents[]}" }
  /api/v1/telemetry/metrics:
    get:
      tags: [observability]
      parameters:
        - { name: asset_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: metric, in: query, required: true, schema: { type: string } }
        - { name: window, in: query, schema: { type: string, default: 15m } }
        - { name: step, in: query, schema: { type: string, default: 1m } }
      responses:
        "200": { description: "{asset_id, metric, window, series[{labels, points[[ts,v]]}]}" }
  /api/v1/events:
    get:
      tags: [observability]
      parameters:
        - { name: asset_id, in: query, schema: { type: string, format: uuid } }
        - { name: window, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: "#/components/schemas/Event" } } } } } } }
  /api/v1/incidents:
    get:
      tags: [incidents]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Incident" } } } } } } }
    post:
      tags: [incidents]
      summary: Ручное создание инцидента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, severity]
              properties:
                title: { type: string }
                severity: { type: string, enum: [critical, high, medium, low, info] }
                asset_ids: { type: array, items: { type: string, format: uuid } }
                description: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Incident" } } } }
  /api/v1/incidents/golden-candidates:
    get:
      tags: [incidents]
      summary: Экспорт подтверждённых оценок оператора в формате golden dataset (JSONL, ai/evals/eval-case.schema.json)
      responses:
        "200": { description: application/x-ndjson }
  /api/v1/incidents/{id}:
    get:
      tags: [incidents]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Incident" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/transitions:
    post:
      tags: [incidents]
      summary: "Переход C.7 (new→triaged→investigating→mitigated→resolved→closed, reopened); mitigated требует evidence_ref, resolved (≥ high) — постмортем"
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [to, reason], properties: { to: { type: string }, reason: { type: string }, evidence_ref: { type: string } } } } } }
      responses:
        "200": { description: OK }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/analyze:
    post:
      tags: [incidents]
      summary: Запустить RCA (задача оркестратора)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "202": { description: "{task_id}" }
  /api/v1/incidents/{id}/rca:
    post:
      tags: [incidents]
      summary: Результат RCA — только service `orchestrator`; выводы — гипотезы, статус инцидента не меняется
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RCA" } } } }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/feedback:
    post:
      tags: [incidents]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [correct, rating], properties: { correct: { type: boolean }, actual_cause: { type: string }, rating: { type: integer, minimum: 1, maximum: 5 }, comment: { type: string } } } } } }
      responses:
        "200": { description: OK }
  /api/v1/incidents/{id}/postmortem:
    post:
      tags: [incidents]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [summary, root_cause], properties: { summary: { type: string }, root_cause: { type: string }, corrective_actions: { type: array, items: { type: string } } } } } } }
      responses:
        "200": { description: OK }
  /api/v1/discovery/scopes:
    get:
      tags: [discovery]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ScopeDocument" } } } } } } }
    post:
      tags: [discovery]
      summary: Scope Document (§8.1); без утверждения не действует
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ScopeDocument" } } } }
      responses:
        "201": { description: Created }
  /api/v1/discovery/scopes/{id}/approve:
    post:
      tags: [discovery]
      summary: Утверждение Tenant Admin (не автором)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/discovery/jobs:
    post:
      tags: [discovery]
      summary: Запуск discovery (C.9); без активного scope или вне диапазонов — 403 policy-denied
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope_id, targets]
              properties:
                scope_id: { type: string, format: uuid }
                targets:
                  type: array
                  items:
                    type: object
                    required: [address, method]
                    properties:
                      address: { type: string }
                      method: { type: string, enum: [ssh, docker_api, postgres, fortigate_api] }
                      port: { type: integer }
                      credential_ref: { type: string }
                      host_key: { type: string }
      responses:
        "202": { description: Accepted }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/discovery/jobs/{id}:
    get:
      tags: [discovery]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: "статус, new/changed/missing, findings" }
  /api/v1/discovery/jobs/{id}/confirm:
    post:
      tags: [discovery]
      summary: Подтверждение объектов с низким confidence → CMDB
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { keys: { type: array, items: { type: string } } } } } } }
      responses:
        "200": { description: OK }
  /api/v1/dev/simulator:
    post:
      tags: [safety]
      summary: "DEV ONLY (симулятор + dev-аутентификация): состояние симулируемой инфраструктуры для демо и тестов"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [asset_id]
              properties:
                asset_id: { type: string }
                object: { type: string }
                running: { type: boolean }
                disk_percent: { type: number, minimum: 0, maximum: 100 }
                fault: { type: string, enum: [post_check_fail, channel_lost, hang_confirm, hang_noconfirm, exit_nonzero] }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/audit/ai-calls:
    post:
      tags: [audit]
      summary: "Только service `orchestrator`: метаданные вызовов LLM и инструментов → hash chain tenant (§6.3). Промпты не принимаются"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                records: { type: array, minItems: 1, maxItems: 200, items: { type: object, required: [record_type, call_id, tenant_id] } }
      responses:
        "202": { description: Accepted }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/compliance/controls:
    get:
      tags: [audit]
      summary: Статусы контролей tenant (не сертификация; соответствие подтверждается аудитом)
      responses:
        "200": { description: OK }
  /api/v1/compliance/controls/{id}/assessment:
    post:
      tags: [audit]
      summary: "Оценка контроля (Compliance Manager / Tenant Admin, MFA). implemented/verified — только с evidence (T-COMP-001); not_applicable — с обоснованием"
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [not_assessed, applicable, implemented, partially_implemented, non_compliant, not_applicable, verified] }
                evidence_ids: { type: array, maxItems: 50, items: { type: string } }
                justification: { type: string, maxLength: 2000 }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/agents:
    get:
      tags: [ai]
      summary: Реестр агентов (M02, §5.2) — capabilities, tools, runbooks, model profile; источник — ai/agents
      responses:
        "200": { description: OK }
components:
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-AdminTwin-Service-Token
    devHeaders:
      type: apiKey
      in: header
      name: X-AdminTwin-Actor
      description: "DEV ONLY. Также X-AdminTwin-Tenant, X-AdminTwin-Actor-Kind (user|ai_agent|service), X-AdminTwin-Roles, X-AdminTwin-Scopes."
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem:
      description: RFC 9457
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ["https://errors.admintwin.io/policy-denied"]
          description: "policy-denied | budget-exhausted | kill-switch-active | legal-hold | separation-of-duties | invalid-params | not-found | unauthenticated | forbidden | conflict | idempotency-key-reused | bad-request | internal"
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        policy_id: { type: string }
        change_id: { type: string }
        request_id: { type: string }
        errors: { type: array, items: { type: object, properties: { field: { type: string }, reason: { type: string } } } }
    Sample:
      type: object
      required: [asset_id, metric, value, at]
      properties:
        asset_id: { type: string, format: uuid }
        metric: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        value: { type: number, description: "http_5xx_rate — в процентах (0..100)" }
        at: { type: string, format: date-time }
    Event:
      type: object
      properties:
        id: { type: string }
        asset_id: { type: string }
        kind: { type: string }
        severity: { type: string, enum: [critical, high, medium, low, info] }
        title: { type: string }
        fingerprint: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        value: { type: number }
        at: { type: string, format: date-time }
    Hypothesis:
      type: object
      properties:
        cause: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        supporting: { type: array, items: { type: object, properties: { fact: { type: string }, evidence_id: { type: string } } } }
        refuting: { type: array, items: { type: object } }
        next_checks: { type: array, items: { type: string } }
    RCA:
      type: object
      properties:
        task_id: { type: string }
        status: { type: string, enum: [not_started, running, completed, uncertain, failed] }
        hypotheses: { type: array, items: { $ref: "#/components/schemas/Hypothesis" } }
        conclusion: { type: string }
        uncertainty_check: { type: string }
        agents: { type: array, items: { type: string } }
        cost_usd: { type: number }
        proposed_changes: { type: array, items: { type: string } }
    Incident:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        title: { type: string }
        severity: { type: string, enum: [critical, high, medium, low, info] }
        status: { type: string, enum: [new, triaged, investigating, mitigated, resolved, closed, reopened] }
        owner: { type: string }
        asset_ids: { type: array, items: { type: string } }
        event_ids: { type: array, items: { type: string } }
        timeline: { type: array, items: { type: object, properties: { at: { type: string, format: date-time }, actor: { type: string }, kind: { type: string }, text: { type: string }, ref: { type: string } } } }
        rca: { $ref: "#/components/schemas/RCA" }
        postmortem: { type: [object, "null"] }
        feedback: { type: [object, "null"] }
        created_at: { type: string, format: date-time }
    ScopeDocument:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        ranges: { type: array, items: { type: string, examples: ["10.0.0.0/24"] } }
        methods: { type: array, items: { type: string } }
        credential_refs: { type: array, minItems: 1, maxItems: 64, items: { type: string }, description: "Ссылки Vault, разрешённые в заданиях этого scope (утверждаются вместе с диапазонами)" }
        limits: { type: object, properties: { max_sessions: { type: integer }, pps: { type: integer } } }
        responsible: { type: string }
        valid_until: { type: string, format: date-time }
        approved_at: { type: [string, "null"], format: date-time }
    TenantPolicy:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        mode: { type: string, enum: [observer, advisor, operator, autonomous] }
        autonomous_medium_runbooks: { type: array, items: { type: string } }
        denied_runbooks_by_environment: { type: object, additionalProperties: { type: array, items: { type: string } } }
        maintenance_windows: { type: array, items: { type: object, properties: { start: { type: string, format: date-time }, end: { type: string, format: date-time } } } }
    ChangeCreate:
      type: object
      additionalProperties: false
      required: [runbook_id, asset_id, params, reason]
      properties:
        runbook_id: { type: string, examples: [docker.container.restart] }
        asset_id: { type: string, format: uuid }
        params: { type: object, description: Валидируются по схеме runbook и allowlist; значения из inventory проверяются в CMDB tenant }
        reason: { type: string, minLength: 1 }
        incident_id: { type: [string, "null"], format: uuid }
        type: { type: string, enum: [standard, normal, emergency], default: normal, description: emergency — break-glass, только TA/ITM }
        dry_run: { type: boolean, default: false }
    Change:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        type: { type: string, enum: [standard, normal, emergency] }
        status:
          type: string
          enum: [draft, impact_assessed, risk_assessed, waiting_approval, proposed, approved, rejected, scheduled, preflight_failed,
                 executing, verified, rolled_back, compensated, failed, cancellation_pending, cancelled, unknown, manual_review,
                 closed, closed_with_rollback, closed_with_compensation]
        runbook_id: { type: string }
        runbook_version: { type: string }
        runbook_digest: { type: string }
        risk: { type: string, enum: [low, medium, high, critical] }
        asset_id: { type: string }
        params: { type: object }
        author_id: { type: string }
        author_kind: { type: string, enum: [user, ai_agent, service] }
        impact: { type: object }
        policy: { type: object }
        decisions: { type: array, items: { type: object } }
        executions: { type: array, items: { type: object } }
        follow_up_proposals: { type: array, items: { type: string } }
        transitions: { type: array, items: { type: object, properties: { from: { type: string }, to: { type: string }, actor: { type: string }, reason: { type: string }, at: { type: string, format: date-time } } } }
        pir_required: { type: boolean }
        pir_due_at: { type: [string, "null"], format: date-time }
    Asset:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        environment: { type: string, enum: [production, staging, dev, test] }
        ring: { type: string }
        service_tier: { type: integer, minimum: 0, maximum: 3 }
        criticality: { type: string }
        data_class: { type: string, enum: [public, internal, confidential, pii, secret] }
        legal_hold: { type: boolean }
        owner: { type: string }
        verified: { type: boolean }
    AssetList:
      type: object
      properties: { items: { type: array, items: { $ref: "#/components/schemas/Asset" } } }
    Impacted:
      type: object
      properties:
        asset_id: { type: string }
        name: { type: string }
        depth: { type: integer }
        confidence: { type: number }
        service_tier: { type: integer }
        criticality: { type: string }
