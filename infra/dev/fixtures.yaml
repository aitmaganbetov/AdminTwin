# Демо-данные для локальной разработки и e2e-тестов (ADMINTWIN_FIXTURES).
# Два tenant подтверждают изоляцию (§1.2), а не коммерческую готовность SaaS.
tenants:
  - id: 7c1e0c52-0000-4000-8000-00000000a001          # policy id
    tenant_id: 11111111-1111-4111-8111-111111111111
    mode: operator
    autonomous_medium_runbooks: []
    denied_runbooks_by_environment: {}
  - id: 7c1e0c52-0000-4000-8000-00000000b001
    tenant_id: 22222222-2222-4222-8222-222222222222
    mode: advisor                                     # режим по умолчанию

assets:
  # --- tenant A: сценарий HTTP 502 ---
  - id: a0000000-0000-4000-8000-000000000001
    tenant_id: 11111111-1111-4111-8111-111111111111
    name: fw-edge-01
    type: firewall
    environment: production
    service_tier: 0
    criticality: critical
    data_class: internal
    owner: network-team
    verified: true
  - id: a0000000-0000-4000-8000-000000000002
    tenant_id: 11111111-1111-4111-8111-111111111111
    name: docker-web-01
    type: docker_host
    environment: production
    ring: ring1
    service_tier: 1
    criticality: high
    data_class: confidential
    owner: web-team
    verified: true
    health_endpoint: http://docker-web-01.internal/healthz
    objects:
      container:
        - 3f2a9c1b7d4e                                  # app-api
        - 9b8c7d6e5f4a                                  # nginx
        - 0a1b2c3d4e5f                                  # vault-agent (protected)
    protected: [0a1b2c3d4e5f]
  - id: a0000000-0000-4000-8000-000000000003
    tenant_id: 11111111-1111-4111-8111-111111111111
    name: app-linux-01
    type: linux_host
    environment: production
    ring: ring1
    service_tier: 1
    criticality: high
    data_class: confidential
    owner: web-team
    verified: true
    objects:
      systemd_unit: [nginx.service, php-fpm.service, docker.service]
      log_directory: [/var/log/nginx, /var/log/app]
  - id: a0000000-0000-4000-8000-000000000004
    tenant_id: 11111111-1111-4111-8111-111111111111
    name: pg-main-01
    type: database
    environment: production
    service_tier: 0
    criticality: critical
    data_class: pii
    owner: dba-team
    verified: true
  - id: a0000000-0000-4000-8000-000000000005
    tenant_id: 11111111-1111-4111-8111-111111111111
    name: log-archive-01
    type: linux_host
    environment: production
    service_tier: 2
    criticality: medium
    data_class: confidential
    owner: secops
    verified: true
    legal_hold: true                                   # T-LH-001
    active_investigation: true
    objects:
      systemd_unit: [nginx.service]
      log_directory: [/var/log/app]

  # --- tenant B: изоляция ---
  - id: b0000000-0000-4000-8000-000000000001
    tenant_id: 22222222-2222-4222-8222-222222222222
    name: docker-b-01
    type: docker_host
    environment: staging
    service_tier: 2
    criticality: low
    data_class: internal
    owner: b-ops
    verified: true
    objects:
      container: [3f2a9c1b7d4e]

dependencies:
  # source зависит от target
  - {tenant_id: 11111111-1111-4111-8111-111111111111, source: a0000000-0000-4000-8000-000000000002, target: a0000000-0000-4000-8000-000000000004, relation_type: connects_to, confidence: 0.9, verified_by: discovery}
  - {tenant_id: 11111111-1111-4111-8111-111111111111, source: a0000000-0000-4000-8000-000000000003, target: a0000000-0000-4000-8000-000000000002, relation_type: proxies_to, confidence: 0.8, verified_by: discovery}
  - {tenant_id: 11111111-1111-4111-8111-111111111111, source: a0000000-0000-4000-8000-000000000001, target: a0000000-0000-4000-8000-000000000003, relation_type: routes_to, confidence: 1.0, verified_by: user}
