[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "admintwin-ai"
version = "0.1.0"
description = "AdminTwin AI layer and orchestrator service: AI Provider Layer (M21), Tool Layer, Commander (M01), inter-agent bus, evals (M22)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "anthropic>=2.0,<3",
  "openai>=2.0,<4",
  "httpx>=0.27",
  "pydantic>=2.7,<3",
  "jsonschema>=4.22,<5",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "nats-py>=2.9,<3",
]

[project.scripts]
admintwin-orchestrator = "admintwin_ai.service.__main__:main"
admintwin-eval = "admintwin_ai.evals.run:main"
admintwin-eval-gate = "admintwin_ai.evals.gate:main"
admintwin-llm-compat = "admintwin_ai.providers.compat_check:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "types-jsonschema",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/admintwin_ai"]

# Contract data (JSON Schema, agent definitions, golden dataset) lives in the
# spec layout (ai/tools, ai/contracts, ai/agents, ai/evals); it is copied into
# the wheel so that a non-editable install works the same way.
[tool.hatch.build.targets.wheel.force-include]
"tools" = "admintwin_ai/_data/tools"
"contracts" = "admintwin_ai/_data/contracts"
"agents" = "admintwin_ai/_data/agents"
"evals" = "admintwin_ai/_data/evals"
"config" = "admintwin_ai/_data/config"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PT"]
ignore = [
  "S101",   # assert in tests
  "RUF001", # ambiguous unicode in strings: payloads are deliberately multilingual
  "RUF002",
  "RUF003",
  "PT018",  # composite assertions are fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["admintwin_ai"]
known-local-folder = ["fakes", "support", "svc", "bus_cases", "test_prompt_injection"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
"src/admintwin_ai/masking.py" = ["S105"]  # MaskKind.SECRET — имя плейсхолдера, не пароль

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["admintwin_ai"]
