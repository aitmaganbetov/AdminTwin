name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: admintwin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: lint
        run: make lint
      - name: OpenAPI document is valid
        run: pipx run openapi-spec-validator==0.7.1 docs/api/openapi.yaml
      - name: unit + e2e (race)
        run: make test-race
      - name: PostgreSQL — RLS isolation (T-TENANT-001) and core store across restarts
        env:
          PGPASSWORD: ci-only
          ADMINTWIN_TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/admintwin_test?sslmode=disable
          ADMINTWIN_TEST_STORE_URL: postgres://postgres:ci-only@localhost:5432/admintwin_store?sslmode=disable
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE admintwin_store"
          make test-db
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.3 ./...
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ruff + pytest (offline; no real LLM calls)
        run: make ai-test
